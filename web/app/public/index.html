<html>

<head>
  <title>Broadpeak SIMID demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- shaka-player -->
  <script src="./lib/shaka-player/4.14.2/shaka-player.compiled.js"></script>

  <!-- smartlib -->
  <script src="./lib/smartlib/base.smartlib.browser.js"></script>
  <script src="./lib/smartlib/analytics.smartlib.browser.js"></script>
  <script src="./lib/smartlib/shaka.smartlib.browser.js"></script>
  <script src="./lib/smartlib/ad.smartlib.browser.js"></script>
  <script src="./lib/smartlib/simid.smartlib.browser.js"></script>

  <!-- app -->
  <script src="./dist/main.js"></script>

  <style>
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
    }
  </style>
</head>

<body class="grid grid-cols-2 h-screen w-screen gap-2">
  <div class="flex flex-col gap-2">
    <div class="inputs-1 z-99">
      <div id="stream-1" class="input flex gap-2 items-centre">
        <input type="text" id="stream-edit-url-1" size=100 value="" class="border border-neutral-300 p-2 rounded-sm">
        <button id="stream-button-load-1" class="bg-blue-500 p-2 text-white h-fit rounded-sm">LOAD</button>
        <button id="stream-button-stop-1" class="bg-blue-500 p-2 text-white h-fit rounded-sm">STOP</button>
      </div>
    </div>
    <div id="main-1" class="w-full h-full p-4 flex flex-col gap-2 relative">
      <div id="player-1" class="w-[90%] transition-all absolute left-0 top-0 z-99">
        <video id="video-1" class="w-full" controls autoplay muted></video>
      </div>
    </div>
  </div>
  <div class="flex flex-col gap-2">
    <div class="inputs-2 z-99">
      <div id="stream-2" class="input flex gap-2 items-centre">
        <input type="text" id="stream-edit-url-2" size=100 value="" class="border border-neutral-300 p-2 rounded-sm">
        <button id="stream-button-load-2" class="bg-blue-500 p-2 text-white h-fit rounded-sm">LOAD</button>
        <button id="stream-button-stop-2" class="bg-blue-500 p-2 text-white h-fit rounded-sm">STOP</button>
      </div>
    </div>
    <div id="main-2" class="w-full h-full p-4 flex flex-col gap-2 relative">
      <div id="player-2" class="w-[90%] transition-all absolute left-0 top-0 z-99">
        <video id="video-2" class="w-full" controls autoplay muted></video>
      </div>
    </div>
  </div>

</main>

</body>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(() => initApp(), 500);
  });

  window.addEventListener('beforeunload', function () {
    stopApp();
  });
</script>

</html>


<html>
<head>
  <title>Broadpeak SIMID demo</title>
  
  <!-- shaka-player -->
  <script src="./lib/shaka-player/4.14.2/shaka-player.compiled.js"></script>

  <!-- app -->
  <script src="./dist/main.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: black;
      color: white;
      text-align: center;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 1vw;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #111;
      overflow: hidden;
    }

    .inputs {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      background: #3d3838;
      gap: 8px;
      margin: 8px;
      padding: 8px 16px;
      z-index: 999;
    }

    .inputs button,
    .inputs select,
    .inputs input {
      height: 24px;
      box-sizing: border-box;
    }
    
    .inputs label {
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .inputs .input {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .flex-edit {
      flex: 1 1 0;
      min-width: 0;
    }

    .inputs button {
      padding: 4px;
    }

    .app {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #player-container {
      position: relative;
      aspect-ratio: 16 / 9;
      width: min(100%, calc((100vh - 90px) * 16 / 9));
      height: auto;
      max-height: calc(100vh - 90px);
    }

    #player {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      transition: all .5s linear;
    }

    #video {
      object-fit: contain;
      width: 100%;
      height: auto;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      border: 0;
    }

</style>
</head>
<body>
  
<main>

  <div class="inputs">
    <div id="stream" class="input">
      <label for="stream-edit-url">Stream:</label>
      <input type="text" id="stream-edit-url" class="flex-edit" value="">
      <button id="stream-button-load">LOAD</button>
      <button id="stream-button-stop">STOP</button>
    </div>
    <div id="creative" class="input">
      <label for="creative-edit-url">Creative:</label>
      <input type="text" id="creative-edit-url" class="flex-edit" value="https://interactiveadvertisingbureau.github.io/SIMID/examples/creatives/banner_nonlinear.html">
      <label for="creative-edit-adparams">Ad params:</label>
      <input type="text" id="creative-edit-adparams" class="flex-edit" value='{"bannerText":"Click here to draw!","webUrl":"https://quickdraw.withgoogle.com/"}'>
      <label for="creative-edit-duration">duration:</label>
      <input type="text" id="creative-edit-duration" size=10 value="10">
      <button id="creative-button-start">START</button>      </div>
    </div>
  </div>

  <div class="app">
    <div id="player-container">
      <div id="player">
        <video id="video" controls autoplay muted></video>
      </div>
      <!-- iframe -->
    </div>
  </div>

</main>

</body>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(() => initApp(), 500);
  });

  window.addEventListener('beforeunload', function () {
    stopApp();
  });
</script>
</html>

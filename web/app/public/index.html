<html>

<head>
  <title>Broadpeak SIMID demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- shaka-player -->
  <script src="./lib/shaka-player/4.14.2/shaka-player.compiled.js"></script>

  <!-- smartlib -->
  <script src="./lib/smartlib/base.smartlib.browser.js"></script>
  <script src="./lib/smartlib/analytics.smartlib.browser.js"></script>
  <script src="./lib/smartlib/shaka.smartlib.browser.js"></script>
  <script src="./lib/smartlib/ad.smartlib.browser.js"></script>
  <script src="./lib/smartlib/simid.smartlib.browser.js"></script>

  <!-- app -->
  <script src="./dist/main.js"></script>

  <style>
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
    }
  </style>
</head>

<body class="h-screen w-screen p-4 flex flex-col items-center">
  <div class="border border-neutral-300 flex flex-col w-fit mb-4 rounded-md p-4">
    <h1 class="text-lg">Configure Streams</h1>
    <hr class="border-neutral-300 my-2">
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-neutral-500 text-sm" for="stream-content">Stream Content</label>
        <select class="border border-neutral-300 p-1 rounded-sm" name="content" id="stream-content">
          <option value="">--Please choose some content--</option>
          <option value="ice-hockey">Ice Hockey</option>
          <option value="chicago-fire">Chicago Fire</option>
        </select>
      </div>
      <div class="flex gap-4">
        <span class="flex flex-col gap-1">
          <label class="text-neutral-500 text-sm" for="audience-select-1">Stream 1 Audience</label>
          <select class="border border-neutral-300 p-1 rounded-sm" name="audience-1" id="audience-select-1">
            <option value="">--Please choose an audience--</option>
            <option value="L_Ban_POC_HIGH">High</option>
            <option value="L_Ban_POC_MID">Mid</option>
            <option value="L_Ban_POC_LOW">Low</option>
          </select>
        </span>
        <span class="flex flex-col gap-1">
          <label class="text-neutral-500 text-sm" for="audience-select-2">Stream 2 Audience</label>
          <select class="border border-neutral-300 p-1 rounded-sm" name="audience-2" id="audience-select-2">
            <option value="">--Please choose an audience--</option>
            <option value="L_Ban_POC_HIGH">High</option>
            <option value="L_Ban_POC_MID">Mid</option>
            <option value="L_Ban_POC_LOW">Low</option>
          </select>
        </span>
      </div>
      <div>
        <button id="stream-button-load" class="bg-blue-500 px-2 py-1 text-white h-fit rounded-sm">LOAD</button>
        <button id="stream-button-stop" class="bg-blue-500 px-2 py-1 text-white h-fit rounded-sm">STOP</button>
      </div>
    </div>
  </div>
  <div class="grid lg:grid-cols-2 grid-cols-1 gap-2 place-items-center w-full my-auto">
    <div id="main-1" class="w-160 h-90 flex flex-col gap-2 relative border border-neutral-300">
      <div id="player-1" class="w-full transition-all absolute left-0 top-0">
        <video id="video-1" class="w-full" muted></video>
      </div>
    </div>
    <div id="main-2" class="w-160 h-90 flex flex-col gap-2 relative border border-neutral-300">
      <div id="player-2" class="w-full transition-all absolute left-0 top-0">
        <video id="video-2" class="w-full" muted></video>
      </div>
    </div>
  </div>
  <div class="flex gap-4">
    <div class="border border-neutral-300 flex w-fit mb-4 rounded-md p-4 gap-4">
      <span class="flex flex-col gap-1">
        <label class="text-neutral-500 text-sm" for="content-seek">Go to Ad</label>
        <select id="ad-seek-select" class="border border-neutral-300 p-1 rounded-sm">
          <option value="">--Please choose an ad--</option>
        </select>
      </span>
      <button id="seek-button" class="bg-blue-500 px-2 py-1 mt-auto text-white h-fit rounded-sm">Seek</button>
    </div>
    <div class="border border-neutral-300 flex flex-col w-fit mb-4 rounded-md p-4 gap-1">
      <p class="text-neutral-500 text-sm">Playback Controls</p>
      <span class="flex gap-4">
        <button id="play-button" class="bg-blue-500 px-2 py-1 text-white h-fit rounded-sm">Play</button>
        <button id="pause-button" class="bg-blue-500 px-2 py-1 text-white h-fit rounded-sm">Pause</button>
      </span>
    </div>
  </div>
</body>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(() => initApp(), 500);
  });

  window.addEventListener('beforeunload', function () {
    stopApp();
  });
</script>

</html>

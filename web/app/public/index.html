<html>

<head>
  <title>Broadpeak SIMID demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- shaka-player -->
  <script src="./lib/shaka-player/4.14.2/shaka-player.compiled.js"></script>

  <!-- smartlib -->
  <script src="./lib/smartlib/base.smartlib.browser.js"></script>
  <script src="./lib/smartlib/analytics.smartlib.browser.js"></script>
  <script src="./lib/smartlib/shaka.smartlib.browser.js"></script>
  <script src="./lib/smartlib/ad.smartlib.browser.js"></script>
  <script src="./lib/smartlib/simid.smartlib.browser.js"></script>

  <!-- app -->
  <script src="./dist/main.js"></script>
  <style type="text/tailwindcss">
    .card {
      @apply border border-neutral-300 flex w-fit rounded-md p-4;
    }

    select {
      @apply border border-neutral-300 px-2 py-1.75 rounded-sm
    }

    label, .label {
      @apply text-neutral-500 text-sm;
    }

    button {
      @apply rounded-md px-3 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-400 transition-colors;
    }

    .player {
      @apply w-full transition-all absolute left-0 top-0;
    }

    .player-container {
      @apply w-160 h-90 flex flex-col gap-2 relative border border-neutral-300 rounded-md;
    }
  </style>
  <style>
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
    }
  </style>
</head>

<body class="h-screen w-screen flex items-center">
  <aside class="h-full border-r border-neutral-200 p-4 flex flex-col gap-2 bg-white">
    <h1 class="text-lg">Configure Streams</h1>
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label for="stream-content">Stream Content</label>
        <select name="content" id="stream-content">
          <option value="">--Please choose some content--</option>
          <option value="ice-hockey">Ice Hockey</option>
          <option value="chicago-fire">Chicago Fire</option>
        </select>
      </div>
      <span class="flex flex-col gap-1">
        <label for="audience-select-1">Stream 1 Audience</label>
        <select name="audience-1" id="audience-select-1">
          <option value="">--Please choose an audience--</option>
          <option value="L_Ban_POC_HIGH">High</option>
          <option value="L_Ban_POC_MID">Mid</option>
          <option value="L_Ban_POC_LOW">Low</option>
        </select>
      </span>
      <span class="flex flex-col gap-1">
        <label for="audience-select-2">Stream 2 Audience</label>
        <select name="audience-2" id="audience-select-2">
          <option value="">--Please choose an audience--</option>
          <option value="L_Ban_POC_HIGH">High</option>
          <option value="L_Ban_POC_MID">Mid</option>
          <option value="L_Ban_POC_LOW">Low</option>
        </select>
      </span>
      <div class="flex gap-2">
        <button id="stream-button-load" class="flex-1">Start Stream</button>
        <button id="stream-button-stop" class="flex-1">Stop Stream</button>
      </div>
    </div>
    <hr class="border-neutral-300 my-2">
    <h1 class="text-lg">Playback Controls</h1>
    <span class="flex gap-2">
      <button id="play-button" class="flex-1">Play</button>
      <button id="pause-button" class="flex-1">Pause</button>
    </span>
    <div class="gap-2 flex">
      <span class="flex flex-col gap-1">
        <label for="content-seek">Go to Ad</label>
        <select id="ad-seek-select">
          <option value="">--Please choose an ad--</option>
        </select>
      </span>
      <button id="seek-button" class="flex-1 mt-auto">Go</button>
    </div>
  </aside>
  <div class="flex flex-col flex-1 h-full bg-gray-100">
    <div class="grid grid-cols-1 gap-2 place-items-center w-full h-full">
      <div id="main-1" class="player-container">
        <div id="player-1" class="player">
          <video id="video-1" class="w-full" muted></video>
        </div>
        <svg id="player-1-placeholder" fill="none" class="absolute inset-0 size-full stroke-gray-900/10">
          <defs>
            <pattern id="pattern-d09edaee-fc6a-4f25-aca5-bf9f5f77e14a" width="10" height="10" x="0" y="0"
              patternUnits="userSpaceOnUse">
              <path d="M-3 13 15-5M-5 5l18-18M-1 21 17 3"></path>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#pattern-d09edaee-fc6a-4f25-aca5-bf9f5f77e14a)" stroke="none">
          </rect>
        </svg>
      </div>
      <div id="main-2" class="player-container">
        <div id="player-2" class="player">
          <video id="video-2" class="w-full" muted></video>
        </div>
        <svg id="player-2-placeholder" fill="none" class="absolute inset-0 size-full stroke-gray-900/10">
          <defs>
            <pattern id="pattern-d09edaee-fc6a-4f25-aca5-bf9f5f77e14a" width="10" height="10" x="0" y="0"
              patternUnits="userSpaceOnUse">
              <path d="M-3 13 15-5M-5 5l18-18M-1 21 17 3"></path>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#pattern-d09edaee-fc6a-4f25-aca5-bf9f5f77e14a)" stroke="none">
          </rect>
        </svg>
      </div>
    </div>
  </div>
</body>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(() => initApp(), 500);
  });

  window.addEventListener('beforeunload', function () {
    stopApp();
  });
</script>

</html>
